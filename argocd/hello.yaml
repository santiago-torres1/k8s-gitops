apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/santiago-torres1/k8s-gitops.git
    targetRevision: main
    path: apps/hello            # only this folder is deployed
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true               # delete what's removed from Git
      selfHeal: true            # undo manual changes
    syncOptions:
    - CreateNamespace=true      # create the "hello" namespace if missing