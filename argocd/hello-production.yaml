apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-production
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io   # deleting the app now deletes its resources
spec:
  project: default
  source:
    repoURL: https://github.com/<your-username>/k8s-gitops.git
    targetRevision: main
    path: apps/hello/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-production
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]