apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-staging
resources:
  - ../../base
images:
  - name: nginx
    newTag: 1.28-alpine         # staging runs the newer version
configMapGenerator:
  - name: hello-config
    behavior: merge             # replace only index.html, keep healthz
    files:
      - index.html
patches:
  - path: service-nodeport.yaml